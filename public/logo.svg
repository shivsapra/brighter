<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161C"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="35%" stop-color="#FFD15C"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="starAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FFE28A"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="#262A36" stroke-width="6"/>

  <!-- Subtle ambient halo behind star -->
  <circle cx="256" cy="256" r="160" fill="#FFD15C" opacity="0.06" filter="url(#goldGlow)"/>

  <!-- BS Geometric Interlocked Monogram -->
  <g id="monogram-bs" filter="url(#goldGlow)">
    <!-- B ribbon (Left stem and upper loop) -->
    <path d="M150 130 
             H240 
             C285 130 315 155 315 195 
             C315 225 295 245 265 252 
             L195 252 
             V130 Z" 
          fill="none" 
          stroke="url(#starGold)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- S ribbon (Lower swoop intertwining) -->
    <path d="M310 258 
             C345 268 365 295 365 332 
             C365 375 330 402 275 402 
             H170 
             C155 402 145 390 145 375" 
          fill="none" 
          stroke="url(#starGold)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Interlocking bridge between B and S -->
    <path d="M195 252 
             H280 
             C310 252 330 268 330 295 
             C330 325 305 345 265 345 
             H195" 
          fill="none" 
          stroke="url(#starGold)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Left straight backbone -->
    <line x1="162" y1="130" x2="162" y2="390" 
          stroke="url(#starGold)" 
          stroke-width="26" 
          stroke-linecap="round"/>
  </g>

  <!-- Central Radiant 5-Point Creator Star (The Brighter Star) -->
  <g transform="translate(256, 256)" filter="url(#goldGlow)">
    <!-- 5-point radiant creator star -->
    <path d="M 0 -72 L 16.3 -22.4 L 68.5 -22.4 L 26.2 8.3 L 42.4 57.1 L 0 26.3 L -42.4 57.1 L -26.2 8.3 L -68.5 -22.4 L -16.3 -22.4 Z" 
          fill="url(#starAccent)"/>
    
    <!-- Micro accent star -->
    <path d="M 0 -32 L 7.2 -9.9 L 30.4 -9.9 L 11.6 3.7 L 18.8 25.4 L 0 11.7 L -18.8 25.4 L -11.6 3.7 L -30.4 -9.9 L -7.2 -9.9 Z" 
          transform="rotate(36)" 
          fill="#FFFFFF" 
          opacity="0.95"/>

    <!-- Center point shine -->
    <circle cx="0" cy="0" r="11" fill="#FFFFFF"/>
  </g>
</svg>
