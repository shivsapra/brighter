name: Build Brighter Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://gmipycwwcusmeqvovohm.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_6s1BiMzqhx0plfcCEM4dcA_DNRbTHyo' }}
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: brighter123
          KEY_ALIAS: brighter
          KEY_PASSWORD: brighter123
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} dist-apk/Brighter.apk \;

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brighter-Android-APK
          path: dist-apk/Brighter.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Brighter v1.0.${{ github.run_number }} (Release APK)"
          body: |
            ### 📱 Brighter Android App Release
            Download the signed APK directly to install on your Android device:
            - **Direct Download**: [Brighter.apk](https://github.com/shivsapra/brighter/releases/download/v1.0.${{ github.run_number }}/Brighter.apk)
          files: dist-apk/Brighter.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
